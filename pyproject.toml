[project]
name = "email-assistant"
version = "1.0.0"
description = "LangGraph email assistant with authentication, Gmail search/send tools and human approval for sending"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-groq>=1.0",
    "python-dotenv>=1.0",
]

# Only needed to launch the agent with `langgraph dev` / `pnpm dev`.
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4",
]
