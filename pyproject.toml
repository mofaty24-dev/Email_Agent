[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Fathy", email = "mofaty24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.26.0",
    "imap-tools>=1.15.1",
    "jupyter>=1.1.1",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openrouter>=0.2.9",
    "langgraph-cli[inmem]>=0.4.33",
    "questionary>=2.1.1",
    "scraper>=0.1.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
